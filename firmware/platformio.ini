; Smart Puck firmware for the 1.28" ESP32-S3 round knob display
; (ESP32-S3R8: 8 MB octal PSRAM, 16 MB flash, GC9A01 240x240 round LCD).

[env:smart-puck]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

extra_scripts =
    pre:scripts/ota_secret.py
    post:scripts/ota_auth.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Serial goes over the chip's built-in USB-Serial/JTAG (shows up as a COM port, no driver).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
    knolleary/PubSubClient@2.8
    adafruit/Adafruit NeoPixel@1.12.3
    h2zero/NimBLE-Arduino@1.4.3

; Over-the-air update through Wi-Fi: python -m platformio run -e ota -t upload
; The puck must be on Wi-Fi; Windows has to allow the incoming connection on port 47333
; (see the README).
[env:ota]
extends = env:smart-puck
upload_protocol = espota
upload_port = smart-puck.local
upload_flags =
    --host_port=47333
